[package]
name = "focus-ai-task-manager"
version = "0.3.6"
description = "A local-first personal AI task manager"
authors = ["Focus AI"]
edition = "2021"
rust-version = "1.95"

[build-dependencies]
tauri-build = { version = "=2.6.2", features = [] }

[dependencies]
base64 = "=0.22.1"
zip = { version = "=4.6.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "rustls", "stream"] }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tauri = { version = "=2.11.2", features = ["tray-icon"] }
tauri-plugin-notification = "=2.3.3"
tauri-plugin-single-instance = "=2.4.4"
url = "=2.5.8"
uuid = { version = "=1.24.0", features = ["v4"] }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security_Credentials", "Win32_Storage_FileSystem", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
